name: Guardian Defense CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-regression-tests:
    name: Core Defense & Regression Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Harmless Security Regression Fixtures
        run: python generate_fixtures.py

      - name: Run Full 15-Phase Test Suite
        run: pytest -v tests/test_guardian_all_phases.py

      - name: Run Guardian Self-Defense Audit
        run: python skills/guardian/guardian_cli.py self-audit
